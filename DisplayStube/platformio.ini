[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;platform = espressif32@3.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200    

 


build_flags =
     -D USER_SETUP_LOADED=1
     -include $PROJECT_DIR/lib/myTFTSettings/src/User_Setup_tft.h

   

lib_deps =  
            ../settings
            ../libs/espwifimqtt
            ../libs/ethernetmqtt
            ../libs/serialdummymqtt
            ../libs/myInputsOutputs
            ../libs/arduinowatchdog
            ../libs/mybeeper
            ../libs/mydisplay
            ../libs/mydisplayHeizungsteil
            ../libs/myInputsOutputs
            ../libs/myEncoderESP
            ../libs/myhdc108
            ../libs/myheiztemp
            ../libs/myUhrESP
            ../libs/myUhrBasis
            ../libs/myotaupdater
            ../libs/myupdatewuenscher
            ../libs/myhelligkeit
            ../libs/myRGBW
            ../libs/ir
            
            ../libs/hilfe
            ../libs/canhardESP
            ../libs/myCAN
            
