[env:esp32dev]
  
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200    

 



lib_deps =  
            ../libs/SmartHomeSettings
            ../libs/espwifimqtt
            ../libs/ethernetmqtt
            ../libs/serialdummymqtt
            ../libs/w5100ethernetmqtt           
            ../libs/arduinowatchdog
            ../libs/hilfe
            ../libs/myUhrESP
            ../libs/myUhrBasis
            ../libs/myws2812ledmatrix
            ../libs/myDMXDimmerESP
            ../libs/ir
            ../libs/ws2812streifen
            ../libs/canhardESP
            ../libs/myCAN
            ../libs/myInputsOutputs
            ../libs/myonewire
            ../libs/myotaupdater
            ../libs/esphardwarewatchdog

