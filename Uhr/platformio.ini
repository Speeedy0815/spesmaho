[env:esp32dev]
;platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200    

 



lib_deps =  
            ../settings
            ../libs/espwifimqtt
            ../libs/ethernetmqtt
            ../libs/serialdummymqtt
            ../libs/w5100ethernetmqtt           
            ../libs/arduinowatchdog
            ../libs/hilfe
            ../libs/myUhrESP
            ../libs/myUhrBasis
            ../libs/myRGBW
            ../libs/myws2812ledmatrix
            ../libs/myDMXDimmerESP