[env:stable]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev

monitor_speed = 115200       
lib_deps =  
            ../settings
            ../libs/ethernetmqtt
            ../libs/w5500ethernetmqttESP
            ../libs/serialdummymqtt
            ../libs/myInputsOutputs
            ../libs/arduinowatchdog
            ../libs/mybeeper
            ../libs/mydisplay
            ../libs/myInputsOutputs
            ../libs/myEncoderESP
            ../libs/myotaupdater
            ../libs/myupdatewuenscher
            ../libs/myRGBW
            ../libs/ir
            ../libs/mySpiffsSettingsloader 
            ../libs/geaendertesESP32-DMX-master
            ../libs/myDMXDimmerESP
            ../libs/hilfe
            ../libs/canhardESP
            ../libs/myCAN
            
